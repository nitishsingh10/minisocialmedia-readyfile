<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialApp - Home</title>
  <meta name="description" content="Share your thoughts, images, and connect with others on SocialApp">
  <script>
    // Apply theme immediately to prevent flash
    (function () {
      var theme = localStorage.getItem('socialapp_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-logo">
        <svg viewBox="0 0 24 24">
          <path
            d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z" />
        </svg>
        <span>SocialApp</span>
      </a>

      <div class="navbar-links">
        <a href="index.html" class="nav-link active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
          <span>Home</span>
        </a>
        <a href="discover.html" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
          </svg>
          <span>Discover</span>
        </a>
        <a href="profile.html" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span>Profile</span>
        </a>
        <a href="settings.html" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
          <span>Settings</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-container">
    <!-- Create Post Section -->
    <section class="card create-post-box">
      <form id="createPostForm">
        <div class="create-post-header">
          <div class="avatar" id="userAvatar">U</div>
          <span style="color: var(--text-muted); font-size: 0.95rem;">What's on your mind?</span>
        </div>

        <!-- Blog Mode (Text Area) -->
        <div id="blogMode" class="post-mode active">
          <textarea id="postContent" class="create-post-textarea"
            placeholder="Share your thoughts, ideas, or write a blog post..." maxlength="1000"></textarea>
        </div>

        <!-- Image Mode (Image Upload + Caption) -->
        <div id="imageMode" class="post-mode">
          <div class="image-upload-section">
            <div id="imageDropZone" class="image-drop-zone" onclick="document.getElementById('imageInput').click()">
              <div class="drop-zone-content">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                  <circle cx="8.5" cy="8.5" r="1.5" />
                  <polyline points="21 15 16 10 5 21" />
                </svg>
                <p>Click to upload an image</p>
                <span>or drag and drop</span>
              </div>
            </div>

            <!-- Image Preview -->
            <div id="imagePreviewContainer" class="image-preview-container">
              <img id="imagePreview" class="image-preview" alt="Preview">
              <button type="button" class="remove-image-btn" onclick="handleRemoveImage()" title="Remove image">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="18" y1="6" x2="6" y2="18" />
                  <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Caption Input -->
          <div class="caption-section">
            <input type="text" id="imageCaption" class="caption-input" placeholder="Add a caption for your image..."
              maxlength="200">
          </div>
        </div>

        <!-- Hidden File Input -->
        <input type="file" id="imageInput" class="hidden-file-input" accept="image/*">

        <div class="create-post-actions">
          <div class="post-type-buttons">
            <button type="button" class="post-type-btn active" data-type="text" onclick="handlePostTypeClick('text')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
              </svg>
              Blog
            </button>
            <button type="button" class="post-type-btn" data-type="image" onclick="handlePostTypeClick('image')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <polyline points="21 15 16 10 5 21" />
              </svg>
              Image
            </button>
          </div>
          <button type="submit" class="btn-primary">Post</button>
        </div>
      </form>
    </section>

    <!-- Feed Section -->
    <section id="feed" class="feed">
      <!-- Posts will be rendered here by JavaScript -->
    </section>
  </main>

  <script src="app.js"></script>
  <script src="index.js"></script>
</body>

</html>
